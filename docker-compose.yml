services:
  db:
    image: postgres:16
    container_name: sqlforge_db
    environment:
      POSTGRES_USER: sqlforge
      POSTGRES_PASSWORD: sqlforge
      POSTGRES_DB: sqlforge
    ports:
      - "5433:5432"
    volumes:
      - sqlforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sqlforge_pgdata:
